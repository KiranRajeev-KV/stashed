<!doctype html>
<html lang="en" data-theme="light" data-theme-preference="system">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <link
      id="favicon"
      rel="icon"
      type="image/png"
      sizes="64x64"
      href="/favicon-light.png"
    />
    <meta
      name="description"
      content="Stashed is a self-hosted, shared archive for saving ideas, discovering what others are thinking, and returning to useful thoughts later."
    />
    <script>
      (() => {
        const reloadKey = "stashed-preload-reload-at";
        const reloadGuardMs = 60_000;

        window.addEventListener("vite:preloadError", (event) => {
          try {
            const storedReloadAt = window.sessionStorage.getItem(reloadKey);
            const lastReloadAt = storedReloadAt
              ? Number.parseInt(storedReloadAt, 10)
              : 0;
            const now = Date.now();

            if (
              Number.isFinite(lastReloadAt) &&
              now - lastReloadAt < reloadGuardMs
            ) {
              return;
            }

            window.sessionStorage.setItem(reloadKey, String(now));
          } catch {
            // Keep the normal error boundary when session storage is unavailable.
            return;
          }

          event.preventDefault();
          window.location.reload();
        });
      })();
    </script>
    <script>
      (() => {
        const storageKey = "stashed-theme";
        let preference = "system";

        try {
          const storedPreference = window.localStorage.getItem(storageKey);
          if (
            storedPreference === "light" ||
            storedPreference === "dark" ||
            storedPreference === "system"
          ) {
            preference = storedPreference;
          }
        } catch {
          // Storage can be unavailable in privacy-restricted browsing contexts.
        }

        const theme =
          preference === "system"
            ? window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light"
            : preference;

        document.documentElement.dataset.theme = theme;
        document.documentElement.dataset.themePreference = preference;
        document.getElementById("favicon").href = `/favicon-${theme}.png`;
      })();
    </script>
    <title>Stashed</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
